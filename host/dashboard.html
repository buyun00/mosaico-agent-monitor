<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mosaico Agent Monitor</title><style>
body{font:16px system-ui;background:#14191c;color:#f3ebd2;max-width:850px;margin:40px auto;padding:0 24px}h1{font-size:28px}.cards{display:flex;gap:18px;flex-wrap:wrap}.card{flex:1;min-width:240px;padding:24px;border:1px solid #b8ded5;border-radius:18px}h2{margin-top:0}.quota{margin:16px 0}progress{width:100%;accent-color:#b8ded5}small{color:#96a6a8}li{padding:12px 0}a{color:#b8ded5}
</style><h1>Mosaico Agent Monitor</h1><p>设备连到相同局域网后，填入电脑服务显示的 <code>/quota</code> 地址。</p>
<div class="cards" id="cards"></div><h2>任务</h2><ul id="tasks"></ul><small id="health">正在连接…</small>
<script>
const node=(tag,text)=>{const x=document.createElement(tag);x.textContent=text;return x};
async function update(){try{const state=await(await fetch('/state')).json();const cards=document.querySelector('#cards');cards.replaceChildren();
for(const p of state.providers){const card=node('section','');card.className='card';card.append(node('h2',p.label));
for(const [label,value,reset] of [...(p.five_hour_available?[['五小时剩余',p.five_hour_percent,p.five_hour_reset_seconds]]:[]),['七天剩余',p.weekly_percent,p.reset_seconds]]){
const wrap=node('div',label+' '+(value<0?'--':value+'%'));wrap.className='quota';if(value>=0){const bar=node('progress','');bar.max=100;bar.value=value;wrap.append(bar)}
if(reset>=0)wrap.append(node('small',' 重置倒计时 '+Math.floor(reset/3600)+'h '+Math.floor(reset%3600/60)+'m'));card.append(wrap)}cards.append(card)}
document.querySelector('#tasks').replaceChildren(...state.tasks.map(t=>node('li',t.platform+' · '+t.name+' · '+t.state)));
document.querySelector('#health').textContent=state.tasks.length?'状态已同步':'额度独立采集；任务事件会在平台 Hook 接入并开始会话后显示。';
}catch{document.querySelector('#health').textContent='电脑服务未连接'} }update();setInterval(update,2000);
</script></html>
